
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>
    <link rel="stylesheet" href="updateStudent.css">
   
</head>
<body>

    <div class="container">
        <div class="form-card">
            <h2>Update Student</h2>
            <p class="subtitle">Modify student information</p>

            <form id="studentForm">

                <!-- <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="number" id="studentId" readonly>
                </div> -->

                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" placeholder="Enter student name" required>
                </div>

                <div class="form-group">
                    <label for="studentEmail">Student Email</label>
                    <input type="text" id="studentEmail" placeholder="Enter student email" required>
                </div>

                <div class="form-group">
                    <label for="studentAge">Age</label>
                    <input type="number" id="studentAge" placeholder="Enter age" required>
                </div>

                <div class="form-group">
                    <label for="studentCourse">Course</label>
                    <input type="text" id="studentCourse" placeholder="Enter course" required>
                </div>

                <div class="form-group">
                    <label for="studentMarks">Marks</label>
                    <input type="number" id="studentMarks" placeholder="Enter marks" required>
                </div>

                <button type="submit">Update Student</button>

            </form>
        </div>
    </div>

    <script src="updateStudent.js"></script>
</body>
</html>
